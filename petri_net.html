        <style type="text/css">

             #mynetwork {
                 width: 100%;
                 height: 600px;
                 background-color: #ffffff;
                 border: 1px solid lightgray;

                 float: left;
             }

    <body>
        <div class="card" style="width: 100%">
            
            
            <div id="mynetwork" class="card-body"></div>
        </div>

        
        

        <script type="text/javascript">

              // initialize global variables.
              var edges;
              var nodes;
              var allNodes;
              var allEdges;
              var nodeColors;
              var originalNodes;
              var network;
              var container;
              var options, data;
              var filter = {
                  item : '',
                  property : '',
                  value : []
              };

              

              

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#89CFF0", "id": "p_p1", "label": "p1\nTokens: 2", "shape": "circle", "size": 40}, {"color": "#89CFF0", "id": "p_p2", "label": "p2\nTokens: 0", "shape": "circle", "size": 30}, {"color": "#89CFF0", "id": "p_p3", "label": "p3\nTokens: 0", "shape": "circle", "size": 30}, {"color": "#7CFC00", "height": 40, "id": "t_t1", "label": "t1", "shape": "box", "title": "Click to fire", "width": 40}, {"color": "#A9A9A9", "height": 40, "id": "t_t2", "label": "t2", "shape": "box", "title": "Click to fire", "width": 40}, {"color": "#A9A9A9", "height": 40, "id": "t_t3", "label": "t3", "shape": "box", "title": "Click to fire", "width": 40}]);
                  edges = new vis.DataSet([{"arrows": "to", "from": "p_p1", "label": "1", "smooth": "curvedCW", "to": "t_t1"}, {"arrows": "to", "from": "p_p2", "label": "2", "smooth": "curvedCW", "to": "t_t2"}, {"arrows": "to", "from": "p_p3", "label": "1", "smooth": "curvedCW", "to": "t_t3"}, {"arrows": "to", "from": "t_t1", "label": "1", "smooth": "curvedCCW", "to": "p_p2"}, {"arrows": "to", "from": "t_t2", "label": "1", "smooth": "curvedCCW", "to": "p_p3"}, {"arrows": "to", "from": "t_t3", "label": "2", "smooth": "curvedCCW", "to": "p_p1"}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {
    "configure": {
        "enabled": false
    },
    "edges": {
        "color": {
            "inherit": true
        },
        "smooth": {
            "enabled": true,
            "type": "dynamic"
        }
    },
    "interaction": {
        "dragNodes": true,
        "hideEdgesOnDrag": false,
        "hideNodesOnDrag": false
    },
    "physics": {
        "enabled": true,
        "stabilization": {
            "enabled": true,
            "fit": true,
            "iterations": 1000,
            "onlyDynamicEdges": false,
            "updateInterval": 50
        }
    }
};

                  


                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  

                  return network;

              }
              drawGraph();
        </script>
    </body>
</html>
        <script type="text/javascript">
        network.on("click", function(params) {
            if(params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                if(nodeId.startsWith("t_")){
                    fetch("/fire_transition", {
                        method: "POST",
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({transition: nodeId.substring(2)})
                    }).then(response => response.json()).then(data => {
                        // update node labels and colors
                        for(const [id, label, color, size] of data.nodes){
                            network.body.data.nodes.update({id:id,label:label,color:color,size:size});
                        }
                    });
                }
            }
        });
        </script>
