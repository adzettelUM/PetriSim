        <script type="text/javascript">

              // initialize global variables.
              var edges;
              var nodes;

              var allEdges;

              var originalNodes;
              var network;

              var options, data;

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#89CFF0", "id": "p_p1_ph1_thinking", "label": "p1_ph1_thinking\nTokens: 1", "shape": "circle", "size": 35, "title": "Place p1_ph1_thinking"}, {"color": "#89CFF0", "id": "p_p2_ph1_hungry", "label": "p2_ph1_hungry\nTokens: 0", "shape": "circle", "size": 30, "title": "Place p2_ph1_hungry"}, {"color": "#89CFF0", "id": "p_p3_ph1_eating", "label": "p3_ph1_eating\nTokens: 0", "shape": "circle", "size": 30, "title": "Place p3_ph1_eating"}, {"color": "#89CFF0", "id": "p_p4_ph2_thinking", "label": "p4_ph2_thinking\nTokens: 1", "shape": "circle", "size": 35, "title": "Place p4_ph2_thinking"}, {"color": "#89CFF0", "id": "p_p5_ph2_hungry", "label": "p5_ph2_hungry\nTokens: 0", "shape": "circle", "size": 30, "title": "Place p5_ph2_hungry"}, {"color": "#89CFF0", "id": "p_p6_ph2_eating", "label": "p6_ph2_eating\nTokens: 0", "shape": "circle", "size": 30, "title": "Place p6_ph2_eating"}, {"color": "#89CFF0", "id": "p_f1", "label": "f1\nTokens: 1", "shape": "circle", "size": 35, "title": "Place f1"}, {"color": "#89CFF0", "id": "p_f2", "label": "f2\nTokens: 1", "shape": "circle", "size": 35, "title": "Place f2"}, {"color": "#7CFC00", "height": 60, "id": "t_t1_ph1_start_hungry", "label": "t1_ph1_start_hungry", "shape": "box", "title": "Click to fire", "width": 110}, {"color": "#A9A9A9", "height": 60, "id": "t_t2_ph1_start_eating", "label": "t2_ph1_start_eating", "shape": "box", "title": "Click to fire", "width": 110}, {"color": "#A9A9A9", "height": 60, "id": "t_t3_ph1_finish_eating", "label": "t3_ph1_finish_eating", "shape": "box", "title": "Click to fire", "width": 110}, {"color": "#7CFC00", "height": 60, "id": "t_t1_ph2_start_hungry", "label": "t1_ph2_start_hungry", "shape": "box", "title": "Click to fire", "width": 110}, {"color": "#A9A9A9", "height": 60, "id": "t_t2_ph2_start_eating", "label": "t2_ph2_start_eating", "shape": "box", "title": "Click to fire", "width": 110}, {"color": "#A9A9A9", "height": 60, "id": "t_t3_ph2_finish_eating", "label": "t3_ph2_finish_eating", "shape": "box", "title": "Click to fire", "width": 110}]);
                  edges = new vis.DataSet([{"arrows": "to", "from": "p_p1_ph1_thinking", "label": "1", "smooth": "curvedCW", "to": "t_t1_ph1_start_hungry"}, {"arrows": "to", "from": "p_p2_ph1_hungry", "label": "1", "smooth": "curvedCW", "to": "t_t2_ph1_start_eating"}, {"arrows": "to", "from": "p_f1", "label": "1", "smooth": "curvedCW", "to": "t_t2_ph1_start_eating"}, {"arrows": "to", "from": "p_f2", "label": "1", "smooth": "curvedCW", "to": "t_t2_ph1_start_eating"}, {"arrows": "to", "from": "p_p3_ph1_eating", "label": "1", "smooth": "curvedCW", "to": "t_t3_ph1_finish_eating"}, {"arrows": "to", "from": "p_p4_ph2_thinking", "label": "1", "smooth": "curvedCW", "to": "t_t1_ph2_start_hungry"}, {"arrows": "to", "from": "p_p5_ph2_hungry", "label": "1", "smooth": "curvedCW", "to": "t_t2_ph2_start_eating"}, {"arrows": "to", "from": "p_f2", "label": "1", "smooth": "curvedCW", "to": "t_t2_ph2_start_eating"}, {"arrows": "to", "from": "p_f1", "label": "1", "smooth": "curvedCW", "to": "t_t2_ph2_start_eating"}, {"arrows": "to", "from": "p_p6_ph2_eating", "label": "1", "smooth": "curvedCW", "to": "t_t3_ph2_finish_eating"}, {"arrows": "to", "from": "t_t1_ph1_start_hungry", "label": "1", "smooth": "curvedCCW", "to": "p_p2_ph1_hungry"}, {"arrows": "to", "from": "t_t2_ph1_start_eating", "label": "1", "smooth": "curvedCCW", "to": "p_p3_ph1_eating"}, {"arrows": "to", "from": "t_t3_ph1_finish_eating", "label": "1", "smooth": "curvedCCW", "to": "p_p1_ph1_thinking"}, {"arrows": "to", "from": "t_t3_ph1_finish_eating", "label": "1", "smooth": "curvedCCW", "to": "p_f1"}, {"arrows": "to", "from": "t_t3_ph1_finish_eating", "label": "1", "smooth": "curvedCCW", "to": "p_f2"}, {"arrows": "to", "from": "t_t1_ph2_start_hungry", "label": "1", "smooth": "curvedCCW", "to": "p_p5_ph2_hungry"}, {"arrows": "to", "from": "t_t2_ph2_start_eating", "label": "1", "smooth": "curvedCCW", "to": "p_p6_ph2_eating"}, {"arrows": "to", "from": "t_t3_ph2_finish_eating", "label": "1", "smooth": "curvedCCW", "to": "p_p4_ph2_thinking"}, {"arrows": "to", "from": "t_t3_ph2_finish_eating", "label": "1", "smooth": "curvedCCW", "to": "p_f2"}, {"arrows": "to", "from": "t_t3_ph2_finish_eating", "label": "1", "smooth": "curvedCCW", "to": "p_f1"}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {"physics": {"enabled": false}, "interaction": {"hover": true, "multiselect": false}};

                  


                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  

                  return network;

              }
              drawGraph();

<div id="deadlockBanner" style="display:none;position:fixed;top:0;left:0;width:100%;background:red;color:white;

DEADLOCK — CLICK TO RESET
</div>

<!-- COVERABILITY TREE PANEL -->
<div id="coverabilityTreeContainer" style="position:fixed;top:0;right:0;width:50vw;height:100vh;border-left:2px solid #333;
background:#f8f8f8;overflow:auto;z-index:9997;"></div>

<script src="//cdnjs.cloudflare.com/ajax/libs/socket.io/4.6.1/socket.io.min.js"></script>
<script type="text/javascript">
var socket = io();
function applyNodeUpdate(n){ let u={id:n.id,label:n.label,color:n.color}; if(n.size!==null) u.size=n.size;
if(n.width!==null){u.width=n.width;u.height=n.height;} try{network.body.data.nodes.update(u);}catch(e){console.error(e,u);} }
socket.on("update",function(payload){
    if(payload.nodes) payload.nodes.forEach(n=>applyNodeUpdate(n));
    document.getElementById('deadlockBanner').style.display = payload.deadlocked ? 'block':'none';
    if(payload.message){ document.getElementById('status').innerText=payload.message;
    setTimeout(()=>document.getElementById('status').innerText='',1500);}
});
network.on("click",function(params){
    if(params.nodes && params.nodes.length===1 && params.nodes[0].startsWith("t_")){
        socket.emit("fire",{transition:params.nodes[0].substring(2)});
    }
});
document.getElementById("deadlockBanner").onclick=function(){socket.emit("reset");}
function emitStep(){ var sel=network.getSelectedNodes();
if(sel && sel.length===1 && sel[0].startsWith("t_")) socket.emit("fire",{transition:sel[0].substring(2)});
else socket.emit("step"); }
function emitCoverabilityTree(){socket.emit("show_coverability_tree");}
function emitUndo(){socket.emit("undo");}
function emitRedo(){socket.emit("redo");}
function emitReset(){socket.emit("reset");}
socket.on("coverability_tree_html",function(payload){
    document.getElementById("coverabilityTreeContainer").innerHTML =
    `<iframe src="${payload.html_path}" style="width:100%;height:100%;border:none;"></iframe>`;
});
socket.on("connect",function(){socket.emit("client_ready");});
</script>
</body>
